# +---------------------------------------------------------------------------+
# |                                                                           |
# |                          GyxerChat Elite V3.0                             |
# |                      The All-in-One Chat Solution                         |
# |                         by RyxerEverlynx                                  |
# +---------------------------------------------------------------------------+
#
# Colors: you can use classic codes (&a, &l, &#FF00AA) AND MiniMessage
# tags (<red>, <bold>, <gradient:#ff0000:#0000ff>text</gradient>, <rainbow>)
# in every message below. Both work in the same line.
#
# New keys are added to this file automatically when the plugin updates.
# Do not change this number:
config-version: 2

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# The main prefix used for general plugin responses (Mutes, Warns, Reloads).
prefix: "&8[&bGyxerChat&8] &r"

# Standard Chat Formatting
# You can use any PlaceholderAPI placeholders here (e.g., %vault_prefix%).
# {player}  - The player's name (or nickname).
# {tag}     - The player's active custom tag (from /tags).
# {message} - The text the player typed.
chat-format: "%luckperms_prefix% &7{player} {tag}&8» &f{message}"

# Turn normal letters in formats and messages into small caps (ᴀʙᴄ).
# The text players type is never changed.
small-caps: true

# =============================================================================
# INTERACTIVE CHAT (HOVER & CLICK)
# =============================================================================
# Adds modern interactability to the chat.
interactive-chat:
  enabled: true
  # The command suggested when clicking a player's name.
  click-command: "/msg {player} "
  # Text displayed when hovering over a player's name.
  # Supports PlaceholderAPI + internal: {health}, {ping}, {tag}, {player}, {world}.
  hover-text:
    - "&b&l{player}"
    - "&8&m-------------------"
    - "&7Health: &c{health}❤"
    - "&7Ping: &a{ping}ms"
    - "&7Tag: {tag}"
    - "&8&m-------------------"
    - "&eClick to send a message!"

# =============================================================================
# DISCORD INTEGRATION (JDA SYNC)
# =============================================================================
# Connects your Minecraft server directly to a Discord bot.
# IMPORTANT: Enable "Message Content Intent" in the Discord Developer Portal.
# The bot connects in the background, so the server never waits for Discord.
discord:
  enabled: false
  chat-enabled: true
  console-enabled: true

  # Your unique Bot Token from the Discord Dev Portal.
  bot-token: "YOUR_BOT_TOKEN_HERE"
  # Channel ID where Minecraft chat will be mirrored.
  chat-channel-id: "000000000000000000"
  # Channel ID where the server console is shown (Keep this channel private!).
  console-channel-id: "000000000000000000"
  # Channel ID for staff chat (both ways). Leave empty to turn off.
  staff-channel-id: ""
  # Channel ID for punishment logs (mutes, bans, warns). Empty = console channel.
  log-channel-id: ""

  # Running server commands from the console channel.
  # SAFETY: only the Discord users / roles listed here may run commands.
  # If both lists are empty, NOBODY can run commands from Discord.
  console-commands:
    enabled: false
    allowed-user-ids: []
    allowed-role-ids: []

  # Visual formats for Discord messages. Supports standard Discord Markdown.
  # Nobody gets pinged by messages from Minecraft (no @everyone abuse).
  formats:
    # Used when a player has a prefix (e.g., [Owner]).
    mc-to-discord: "**{prefix} {player}** » {message}"
    # Used when a player has no prefix.
    mc-to-discord-no-prefix: "**{player}** » {message}"
    # Format for Discord messages appearing in Minecraft.
    discord-to-mc: "&8[&9Discord&8] &b{author} &8» &7{message}"
    # Staff chat
    staff-mc-to-discord: "**[Staff] {player}** » {message}"
    staff-discord-to-mc: "&8[&cStaff-DS&8] &c{author} &8» &e{message}"
    # Status alerts sent to Discord.
    join: "**+ {player}** joined the server."
    quit: "**- {player}** left the server."
    death: "☠ **{player}** died."
    server-start: ":green_circle: The server is online."
    server-stop: ":red_circle: The server is offline."

# =============================================================================
# AUTO-BROADCASTER
# =============================================================================
# Sends scheduled announcements to the server and Discord.
auto-broadcaster:
  enabled: true
  # Delay between announcements (in seconds).
  interval-seconds: 180
  # Pick a random message instead of going in order.
  random-order: false
  # Mirror announcements to the Discord chat channel.
  discord-sync: false
  # List of messages to cycle through.
  messages:
    - "&eDon't forget to join our &bDiscord&e: &ndiscord.gg/example"
    - "&aVoting supports the server and gives you free keys! Use &d/vote"
    - "&cFound a bug or need help? Please open a ticket!"

# =============================================================================
# MODERATION & FILTERS
# =============================================================================
chat-settings:
  # Prevents lag exploits/glitches by blocking special unicode characters.
  block-unicode: true
  # Letters with accents (ä ö ü é ß ...) are always allowed.
  # Add more allowed characters here:
  allowed-characters: "❤☠★☆✔✘€£"

  # Can players use & color codes in chat? (also needs gyxerchat.chat.colors)
  allow-color-codes: true

  # Time a player must wait between two messages (milliseconds).
  cooldown-ms: 1000
  # Block sending the exact same message twice in a row within this many seconds (0 = off).
  repeat-block-seconds: 20

  # Nickname Settings
  max-nick-length: 10

  # Plays a sound and highlights names when @Mentioned.
  mentions-enabled: true
  mention-color: "&b"

  # Anti-Caps logic: Prevents yelling in chat.
  anti-caps-enabled: true
  # Percentage of capital letters needed to trigger (70 means 7 out of 10 letters).
  anti-caps-percent: 70
  # Minimum message length before checking for caps.
  anti-caps-min-length: 5

  # Swear Filter Settings
  swear-filter-enabled: true
  # Word Blacklist: Blocked words are replaced with ***.
  blocked-words:
    - "fuck"
    - "shit"
    - "bitch"
    - "nigger"
    - "retard"
    - "asshole"

# =============================================================================
# TELEPORTATION (TPA) SYSTEM
# =============================================================================
tpa-settings:
  enabled: true
  # Number of seconds a player must wait before teleporting.
  cooldown-seconds: 5
  # A request runs out after this many seconds.
  expire-seconds: 60
  # Allow teleporting to another world (nether, end).
  allow-cross-world: true
  # Cancel the teleport when the player takes damage.
  cancel-on-damage: true

# =============================================================================
# CHAT GAMES (ENGAGEMENT ENGINE)
# =============================================================================
# Fun minigames that reward active chatters.
chat-games:
  enabled: true
  use-vault: true
  # Command run to give rewards (used when Vault is off or missing). {reward} is dynamic.
  reward-command: "eco give {player} {reward}"
  # Delay between games (in seconds).
  interval-seconds: 300
  # Nobody answered after this many seconds -> the game ends (0 = never).
  answer-timeout-seconds: 60
  # Only start a game when at least this many players are online.
  min-players: 1

  # Create an infinite number of custom games below!
  # Use numbers as the ID (1, 2, 3, etc.).
  games:
    "1":
      question: "Unscramble this word: &emniearctf"
      ans: "minecraft"
      prize: 1000
    "2":
      question: "Solve the math problem: &e15 + 25"
      ans: "40"
      prize: 500
    "3":
      question: "Type this fast: &eGyxerChat Elite"
      ans: "GyxerChat Elite"
      prize: 2000
    "4":
      question: "Trivia: &eWhat block is unbreakable in Survival?"
      ans: "bedrock"
      prize: 1500

# =============================================================================
# SYSTEM AUTOMATIONS
# =============================================================================
auto-punish:
  enabled: true
  # Max number of chat violations (swearing/spam) before punishment.
  max-strikes: 3
  # Strikes are forgotten after this many minutes.
  strike-reset-minutes: 30
  # Command used for the automated punishment.
  punish-command: "tempmute {player} 10m Auto-Punish: Max Violations"

