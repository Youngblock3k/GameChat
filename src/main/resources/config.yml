# =============================================================================
# AUDIO ENGINE (SOUNDS)
# =============================================================================
# Sound names like UI_BUTTON_CLICK or minecraft:ui.button.click. "none" = silent.
sounds:
  click: "UI_BUTTON_CLICK"
  success: "ENTITY_VILLAGER_YES"
  fail: "ENTITY_VILLAGER_NO"
  mention: "ENTITY_EXPERIENCE_ORB_PICKUP"
  warn: "ENTITY_ENDER_DRAGON_GROWL"
  clear-chat: "ENTITY_PLAYER_LEVELUP"
  tpa-tick: "BLOCK_NOTE_BLOCK_HAT"
  tpa-success: "ENTITY_ENDERMAN_TELEPORT"
